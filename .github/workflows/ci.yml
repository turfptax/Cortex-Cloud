name: CI

# Tests run on pull requests and on pushes to non-default branches. Pushes to
# master run the Deploy workflow, which tests before it deploys, so this avoids
# duplicate test runs on master.
on:
  pull_request:
  push:
    branches-ignore: [master]

jobs:
  gateway-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        # Install the REAL runtime pins, not a hand-copied list. This list had
        # drifted to a bare `mcp`, so CI tested against a different dependency
        # set than the image installs: mcp 2.0 removed mcp.server.fastmcp and
        # CI could not see the pin in requirements.txt. Only test-only extras
        # are added on top.
        run: pip install -r gateway/requirements.txt httpx pytest
      - name: Gateway test suite
        run: cd gateway && python -m pytest -q
