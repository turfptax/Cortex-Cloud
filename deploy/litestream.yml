# Litestream replication config for the two solo-cloud SQLite files.
# The corpus and the credential store. The overseer used to have a
# third; its tables live in the corpus now and replicating the empty
# file would only give the restore something to fail on.
# Azure Blob credentials come from env:
#   LITESTREAM_AZURE_ACCOUNT_KEY   (ACA secret)
#   LITESTREAM_ACCOUNT             storage account name
#   LITESTREAM_CONTAINER           blob container for replicas
dbs:
  - path: /data/cortex.db
    replicas:
      - type: abs
        account-name: ${LITESTREAM_ACCOUNT}
        bucket: ${LITESTREAM_CONTAINER}
        path: cortex.db
  - path: /data/gateway.db
    replicas:
      - type: abs
        account-name: ${LITESTREAM_ACCOUNT}
        bucket: ${LITESTREAM_CONTAINER}
        path: gateway.db
